<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotchBuddy — Interactive macOS Hanging Reminder Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .menubar {
      width: 100%; height: 34px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; font-size: 13px; position: relative; z-index: 20;
    }
    .notch {
      position: absolute; left: 50%; transform: translateX(-50%); top: 0;
      width: 190px; height: 34px; background: #020617;
      border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: #64748b; font-size: 11px; letter-spacing: 0.5px;
    }
    .hang-stage {
      position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
      z-index: 15; pointer-events: none;
    }
    .hang-assembly {
      display: flex; flex-direction: column; align-items: center;
      transform-origin: top center;
      transform: translateY(-280px);
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
    }
    .hang-assembly.visible {
      transform: translateY(0);
      animation: gentleSwing 3.2s ease-in-out infinite;
    }
    @keyframes gentleSwing {
      0%, 100% { transform: translateY(0) rotate(-3.5deg); }
      50% { transform: translateY(0) rotate(3.5deg); }
    }
    .rope { width: 3px; height: 52px; background: linear-gradient(to bottom, #94a3b8, #d97706); }
    .buddy-circle {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; margin-top: -6px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    }
    .bubble {
      margin-top: 10px; padding: 14px 18px; width: 290px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px; text-align: center;
      box-shadow: 0 18px 36px rgba(0,0,0,0.4);
    }
    .bubble p { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .bubble-actions { display: flex; gap: 8px; justify-content: center; }
    .btn {
      border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .controls {
      margin-top: auto; margin-bottom: 64px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 24px; border-radius: 18px; width: 92%; max-width: 440px;
      backdrop-filter: blur(16px);
    }
    .controls h1 { font-size: 18px; margin-bottom: 6px; }
    .controls small { color: #94a3b8; display: block; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select {
      flex: 1; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(2,6,23,0.6); color: #fff; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="menubar">
    <div><strong> NotchBuddy</strong> &nbsp; File &nbsp; Reminders</div>
    <div class="notch">MACBOOK NOTCH</div>
    <div id="clock">12:00 PM</div>
  </div>

  <div class="hang-stage">
    <div class="hang-assembly" id="assembly">
      <div class="rope"></div>
      <div class="buddy-circle" id="buddyFace">🐱</div>
      <div class="bubble">
        <p id="bubbleText">💧 Time to drink water & blink!</p>
        <div class="bubble-actions">
          <button class="btn btn-ghost" onclick="snooze()">Snooze 5s</button>
          <button class="btn btn-primary" onclick="dismiss()">Done</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <h1>NotchBuddy Simulator</h1>
    <small>Interactive preview of the SwiftUI macOS hanging-character reminder.</small>
    <div class="row">
      <select id="character">
        <option value="🐱">🐱 Notch Cat</option>
        <option value="🦥">🦥 Sleepy Sloth</option>
        <option value="🤖">🤖 Mini Bot</option>
        <option value="🦉">🦉 Focus Owl</option>
      </select>
      <input id="msg" type="text" value="💧 Drink water & stretch your back!" />
    </div>
    <button class="btn btn-primary" style="width:100%;padding:11px;" onclick="triggerDrop()">
      Drop Character From Notch
    </button>
  </div>

  <script>
    const assembly = document.getElementById('assembly');
    const buddyFace = document.getElementById('buddyFace');
    const bubbleText = document.getElementById('bubbleText');
    let snoozeTimer = null;

    function triggerDrop() {
      clearTimeout(snoozeTimer);
      buddyFace.textContent = document.getElementById('character').value;
      bubbleText.textContent = document.getElementById('msg').value || '🔔 Reminder!';
      assembly.classList.add('visible');
    }
    function dismiss() {
      assembly.classList.remove('visible');
    }
    function snooze() {
      dismiss();
      snoozeTimer = setTimeout(triggerDrop, 5000);
    }
    function updateClock() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 15000);
    setTimeout(triggerDrop, 700);
  </script>
</body>
</html>
